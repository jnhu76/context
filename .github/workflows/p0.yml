name: p0

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.7"

      - name: Install inspection tools
        run: sudo apt-get update && sudo apt-get install -y binutils

      - name: Debug build and correctness tests
        run: |
          xmake f -m debug
          xmake
          xmake run test_reference
          xmake run test_raw_fcontext

      - name: Release build and symbol verification
        run: |
          xmake f -m release
          xmake
          tools/verify/symbols.sh release

      - name: Benchmark smoke run (no performance gate)
        run: xmake run bench_context_switch 20000

      - name: Submodule cleanliness
        run: |
          test -z "$(git -C third_party/boost-context status --porcelain)"
