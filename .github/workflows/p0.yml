name: p0

# CI is bootstrap only. It prepares a checkout, the submodules, Xmake and the
# inspection tools, then runs the documented verification entry point.
#
# Every verification semantic lives in tools/verify/p0.sh: platform/tool
# prerequisites, submodule identity (initialized, gitlink == HEAD, clean),
# debug build + correctness tests, release build + benchmark smoke run, symbol
# closure inspection in both modes, the cross-mode closure comparison, and the
# negative controls for both oracles. There is exactly one definition of
# "verified"; a build, test, cleanliness or symbol check added here would
# recreate a second, weaker gate that can silently drift from the script
# (see issue #3).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # --- bootstrap / environment only -------------------------------------
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.7"

      - name: Install inspection tools (binutils provides nm, readelf, objdump, ar, c++filt)
        run: sudo apt-get update && sudo apt-get install -y binutils

      # --- single verification gate -----------------------------------------
      - name: Verify (tools/verify/p0.sh)
        run: ./tools/verify/p0.sh
